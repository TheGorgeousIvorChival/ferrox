name: compare

# Config-driven comparison: give CI a working `vless://` link, get a table.
#
# The link is a credential (UUID, public key, server). It arrives as a
# `workflow_dispatch` input, is masked before anything runs, and never reaches
# the report — `ferrox-bench -- --config` prints only the redacted transport
# description (`type= security= flow= support=`). A raw `echo` of the input
# anywhere in this file is a bug; grep for it in review.
#
# Offline columns always run (header encode + record layer, no network).
# Live columns run only when `live=true`: a TCP reachability check that sends
# nothing (see `ferrox-app run`). No handshake, no credentials on the
# wire. Upstream binaries (xray-core, sing-box, xray-rust) are built from
# `upstream/pins.toml` so the "empty with reason" cells name the exact commit
# they would have been measured against.

on:
  workflow_dispatch:
    inputs:
      vless_link:
        description: "Working vless:// link (uuid/pbk stay masked; only type/security/flow reach the report)"
        required: true
        type: string
      live:
        description: "TCP reachability check too (sends nothing)?"
        required: false
        default: "false"

# Dispatch only. The push leg used to fire on any `ferrox-app` edit and
# wrote a report nobody read until the next change; a slice that needs the table
# asks for it by name.
#
# Queued, never cancelled: a run holds the one unrecoverable input in this
# repository (a working `vless://` link), and a cancelled one throws it away.
concurrency:
  group: compare-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  compare:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            os: ubuntu-latest
          - name: macos aarch64
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check the upstream pins resolve
        run: ./scripts/check-upstream-pins.sh
      - name: record the machine
        run: |
          echo "### machine" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            uname -a || ver
            rustc -vV
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: offline comparison (no network, link stays masked)
        env:
          VLESS_LINK: ${{ inputs.vless_link }}
        run: |
          echo "::add-mask::$VLESS_LINK"
          if [ -n "$VLESS_LINK" ]; then
            cargo run --locked --release -p ferrox-bench -- --config "$VLESS_LINK"
          else
            echo "no vless_link input (push run): exercising parser against the brief link shape only"
            cargo test --locked --release -p ferrox-core vless
          fi
      - name: app check (offline, no network)
        env:
          VLESS_LINK: ${{ inputs.vless_link }}
        run: |
          echo "::add-mask::$VLESS_LINK"
          if [ -n "$VLESS_LINK" ]; then
            cargo run --locked --release -p ferrox-app -- check "$VLESS_LINK"
          fi
      - name: live reachability (TCP connect only, sends nothing)
        if: inputs.live == 'true'
        env:
          VLESS_LINK: ${{ inputs.vless_link }}
        run: |
          echo "::add-mask::$VLESS_LINK"
          cargo run --locked --release -p ferrox-app -- run "$VLESS_LINK"
      - name: publish the table
        if: always()
        run: |
          {
            echo
            echo '```'
            cat target/bench-report.md 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
