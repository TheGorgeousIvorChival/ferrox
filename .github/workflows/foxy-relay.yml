name: Foxy relay (live download check)

# Proves the `foxy` lane carries bytes, not just handshakes: it starts
# `ferrox-app` with a socks->foxy config on a clean runner, pins the exit
# country, downloads a real 1 MB file through the tunnel and asserts the exact
# byte count, plus the exit country off the Cloudflare trace. The loopback
# tests prove framing against a local edge; only this job proves the relay
# moves bytes against the real one.
#
# Needs repository secrets like foxy-live.yml does: FOXY_EMAIL and FOXY_PASS
# (or USERNAME and PASSWORD). Without them the job skips cleanly. Quota cost
# is ~1 MB per run, so this fires on lane changes and on demand, not per push.
on:
  pull_request:
    paths:
      - .github/workflows/foxy-relay.yml
      - crates/ferrox-app/**
      - crates/ferrox-core/src/foxy/**
  workflow_dispatch:
    inputs:
      country:
        description: country code to pin the dial at
        required: false
        default: US

permissions:
  contents: read

env:
  NO_PROXY: 127.0.0.1,localhost

jobs:
  foxy-relay:
    name: Foxy relay live (tcp download + udp dns)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets present
        id: secrets
        env:
          FOXY_EMAIL: ${{ secrets.FOXY_EMAIL || secrets.USERNAME }}
          FOXY_PASS: ${{ secrets.FOXY_PASS || secrets.PASSWORD }}
        run: |
          if [ -z "$FOXY_EMAIL" ] || [ -z "$FOXY_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the account secrets are missing; skipping the live relay check."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: foxy-relay
      - name: Build ferrox-app
        if: steps.secrets.outputs.present == 'true'
        run: cargo build --locked -p ferrox-app
      - name: Start socks->foxy on 127.0.0.1:10808
        if: steps.secrets.outputs.present == 'true'
        env:
          FOXY_EMAIL: ${{ secrets.FOXY_EMAIL || secrets.USERNAME }}
          FOXY_PASS: ${{ secrets.FOXY_PASS || secrets.PASSWORD }}
          FOXY_COUNTRY: ${{ inputs.country || 'US' }}
          FOXY_DEBUG: 1
        run: |
          python3 -c 'import json,os; json.dump({"inbounds":[{"protocol":"socks","listen":"127.0.0.1","port":10808}],"outbounds":[{"protocol":"foxy","settings":{"email":os.environ["FOXY_EMAIL"],"password":os.environ["FOXY_PASS"],"country":os.environ["FOXY_COUNTRY"],"carrier":"auto"}}]}, open("foxy-relay.json","w"))'
          chmod 600 foxy-relay.json
          echo "country=$FOXY_COUNTRY" >> "$GITHUB_ENV"
          ./target/debug/ferrox-app run -c foxy-relay.json > ferrox-relay.log 2>&1 &
          echo "$!" > ferrox-relay.pid
      - name: Wait for the SOCKS port
        if: steps.secrets.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/10808) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo "the lane never listened" >&2
          tail -n 30 ferrox-relay.log
          exit 1
      - name: Download a real file through the tunnel
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Diagnosis first, one shot each: full SOCKS+TLS transcript and the
          # raw bytes a plain-HTTP GET brings back through the same tunnel.
          curl -v --max-time 25 --socks5-hostname 127.0.0.1:10808 \
            https://www.cloudflare.com/cdn-cgi/trace -o trace.txt 2>&1 | tail -n 30 || true
          curl -sS --max-time 25 --socks5-hostname 127.0.0.1:10808 \
            http://www.cloudflare.com/cdn-cgi/trace -o body.bin || true
          echo "== plain-http body =="
          wc -c body.bin 2>/dev/null || echo "(no answer)"
          xxd body.bin 2>/dev/null | head -n 8 || true
          # Plain HTTP first: it discriminates a tunnel that moves bytes from
          # one that only opens. TLS through the same tunnel comes next.
          curl -sS --max-time 60 --socks5-hostname 127.0.0.1:10808 \
            http://www.cloudflare.com/cdn-cgi/trace -o trace-http.txt || true
          echo "== plain-http trace =="
          cat trace-http.txt 2>/dev/null || echo "(no answer)"
          # The first flow pays for sign-in, catalogue and edge dial, so the
          # trace is retried; a lane that never answers fails here, loudly.
          for i in $(seq 1 24); do
            if curl -sS --max-time 30 --socks5-hostname 127.0.0.1:10808 \
              https://www.cloudflare.com/cdn-cgi/trace -o trace.txt; then
              break
            fi
            sleep 20
          done
          grep -E '^(loc|ip)=' trace.txt
          grep -qx "loc=${country:?}" trace.txt
          curl -sS --max-time 300 --socks5-hostname 127.0.0.1:10808 \
            'https://speed.cloudflare.com/__down?bytes=1000000' -o file.bin
          test "$(wc -c < file.bin)" = 1000000
          sha256sum file.bin
      - name: DNS through the tunnel over UDP
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Control first: plain TCP to the DNS port through the same tunnel.
          # A fast connect proves egress; a refusal proves the target, and any
          # UDP verdict below must be read against this line.
          timeout 15 curl -v --max-time 12 --socks5-hostname 127.0.0.1:10808 telnet://1.1.1.1:53 || true
          python3 - <<'PY'
          import random, socket, struct, sys, time
          def udp_addr(packet):
              atyp = packet[0]
              if atyp == 1:
                  return 4 + 2, socket.inet_ntoa(packet[1:5])
              if atyp == 4:
                  return 16 + 2, socket.inet_ntop(socket.AF_INET6, packet[1:17])
              ln = packet[1]
              return 1 + 1 + ln + 2, packet[2:2 + ln].decode()
          def dns_query(name):
              qid = random.randint(1, 65534)
              head = struct.pack('>HHHHHH', qid, 0x0100, 1, 0, 0, 0)
              body = b''.join(bytes([len(p)]) + p.encode() for p in name.split('.')) + b'\x00'
              return qid, head + body + struct.pack('>HH', 1, 1)
          def dns_answers(reply, qid):
              (rid, flags, qd, an, _, _) = struct.unpack('>HHHHHH', reply[:12])
              assert rid == qid, 'query id came back different'
              assert flags & 0x000F == 0, 'dns rcode is not zero'
              assert an > 0, 'no answer records'
              at = 12
              for _ in range(qd):
                  while reply[at] != 0:
                      at += 1 + reply[at]
                  at += 5
              out = []
              for _ in range(an):
                  if reply[at] & 0xC0 == 0xC0:
                      at += 2
                  else:
                      while reply[at] != 0:
                          at += 1 + reply[at]
                      at += 1
                  rtype, _, _, rdlen = struct.unpack('>HHIH', reply[at:at + 8])
                  at += 8
                  if rtype == 1 and rdlen == 4:
                      out.append(socket.inet_ntoa(reply[at:at + 4]))
                  at += rdlen
              return out
          tcp = socket.create_connection(('127.0.0.1', 10808), timeout=30)
          tcp.settimeout(30)
          def recv_exact(sock, n):
              out = b''
              while len(out) < n:
                  chunk = sock.recv(n - len(out))
                  if not chunk:
                      raise RuntimeError('eof in handshake')
                  out += chunk
              return out
          tcp.sendall(bytes([5, 1, 0]))
          assert recv_exact(tcp, 2) == b'\x05\x00', 'no method'
          tcp.sendall(bytes([5, 3, 0, 1, 0, 0, 0, 0, 0, 0]))
          head = recv_exact(tcp, 4)
          assert head[:3] == b'\x05\x00\x00', 'associate refused'
          atyp = head[3]
          if atyp == 1:
              port = struct.unpack('>H', recv_exact(tcp, 6)[4:6])[0]
          elif atyp == 4:
              port = struct.unpack('>H', recv_exact(tcp, 18)[16:18])[0]
          else:
              ln = recv_exact(tcp, 1)[0]
              recv_exact(tcp, ln)
              port = struct.unpack('>H', recv_exact(tcp, 2))[0]
          relay = ('127.0.0.1', port)
          udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          udp.settimeout(10)
          # One query per target shape: two IP literals and one DNS name, so
          # the lane log shows one CONNECT-UDP verdict per shape.
          targets = [
              (b'\x00\x00\x00\x01\x01\x01\x01\x01', 53, '1.1.1.1'),
              (b'\x00\x00\x00\x01\x08\x08\x08\x08', 53, '8.8.8.8'),
              (b'\x00\x00\x00\x03\x0eone.one.one.one', 53, 'one.one.one.one'),
          ]
          answers = []
          for hdr, port, name in targets:
              for _ in range(3):
                  qid, query = dns_query('one.one.one.one')
                  udp.sendto(hdr + struct.pack('>H', port) + query, relay)
                  try:
                      packet, _ = udp.recvfrom(65535)
                  except socket.timeout:
                      continue
                  assert packet[:3] == b'\x00\x00\x00', 'bad socks udp header'
                  hlen, _ = udp_addr(packet[3:])
                  got = dns_answers(packet[3 + hlen:], qid)
                  if got:
                      answers.append((name, got))
                      break
          assert answers, 'no dns answer through the tunnel'
          print('dns through the tunnel:', answers)
          PY
      - name: Stop the lane and show its log
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          kill "$(cat ferrox-relay.pid)" 2>/dev/null || true
          echo "== udp lines =="
          grep -iE "udp|masque|datagram" ferrox-relay.log | tail -n 100 || true
          echo "== lane log tail (edges, carriers, relay totals; no secrets) =="
          tail -n 60 ferrox-relay.log
      - name: Keep the whole lane log
        if: always() && steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-relay-log
          path: ferrox-relay.log
          retention-days: 3
      - name: Summarise
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          {
            echo "### Foxy relay, live"
            echo
            echo "Exit country off the tunnel's Cloudflare trace, plus a real"
            echo "1 MB download through the tunnel with its exact byte count"
            echo "and SHA-256 above. The log names the edge, the carrier that"
            echo "answered, and per-flow relay totals."
          } >> "$GITHUB_STEP_SUMMARY"
