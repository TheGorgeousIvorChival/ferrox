[sources.xray-rust]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "f5aefca40b9f492e8095ba3c1620ae627ce331ee"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "git init -q Xray-core && git -C Xray-core fetch --quiet --depth 1 https://github.com/XTLS/Xray-core 5ca6f4b7d4dc20a881d4330e498892697627ec0c && git -C Xray-core checkout --quiet FETCH_HEAD && cargo test -p xray-core-rs --test local_xray_interop_tests -- --ignored --exact --test-threads=1 rust_socks_client_reaches_echo_server_through_local_xray_vless_tcp rust_round_robin_balancer_uses_each_local_xray_vless_member rust_two_hop_proxy_chain_reaches_echo_through_local_xray_vless_servers rust_socks_client_reaches_echo_server_through_local_xray_vless_ws rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade rust_socks_client_reaches_echo_server_through_local_xray_vless_ws_early_data rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade_early_data rust_socks_client_reaches_echo_server_through_local_xray_vless_ws_tls"
ferrox_binary = "ferrox-app"
seam           = "XRAY_VLESS_FULL_BINARY"
note          = "Rust VLESS core; 8 interop tests run against ferrox-app via XRAY_VLESS_FULL_BINARY, checked by conformance.yml; the other 15 stay out until their transports land. Suite fetches the Xray-core checkout the tests assert on because the harness clones only this repo"

[sources.xray-rust-hysteria]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "f5aefca40b9f492e8095ba3c1620ae627ce331ee"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "cargo test -p xray-transport --test hysteria_interop_tests -- --ignored --exact pinned_reference_rejects_wrong_auth_and_closes_failed_tcp_destination"
ferrox_binary = "ferrox-app"
seam          = "XRAY_HYSTERIA_BINARY"
note          = "the same core's Hysteria v2 client against ferrox-app's `protocol: hysteria` inbound: a wrong password is refused and a failed destination closes after the acknowledgement. UDP stays out — ferrox carries no UDP flows, and the two tests that need them name that refusal. The harness's readiness token is the pinned Xray banner; ferrox-app emits it labeled as the harness's string"

