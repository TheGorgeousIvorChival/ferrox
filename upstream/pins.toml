[sources.xray-rust]
repo          = "https://github.com/aimalygin/xray-rust"
rev           = "7a4fb2dd382b8041d6d997b0185397045c8da463"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "git init -q Xray-core && git -C Xray-core fetch --quiet --depth 1 https://github.com/XTLS/Xray-core 5ca6f4b7d4dc20a881d4330e498892697627ec0c && git -C Xray-core checkout --quiet FETCH_HEAD && cargo test -p xray-core-rs --test local_xray_interop_tests -- --ignored --exact --test-threads=1 rust_socks_client_reaches_echo_server_through_local_xray_vless_tcp rust_round_robin_balancer_uses_each_local_xray_vless_member rust_two_hop_proxy_chain_reaches_echo_through_local_xray_vless_servers rust_socks_client_reaches_echo_server_through_local_xray_vless_ws rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade rust_socks_client_reaches_echo_server_through_local_xray_vless_ws_early_data rust_socks_client_reaches_echo_server_through_local_xray_vless_httpupgrade_early_data"
ferrox_binary = "ferrox-app"
seam           = "XRAY_VLESS_FULL_BINARY"
note          = "mobile-first Rust VLESS/REALITY/Vision core; names the plain-TCP VLESS server trio plus the `ws`, `httpupgrade` and `?ed=`-early-data rows against ferrox-app, checked by conformance.yml; the `tls` row is named by this slice and its verdict is conformance.yml's, not this file's. `--exact` is load-bearing: libtest filters by substring, so naming `..._vless_ws` without it also runs `..._vless_ws_tls` and `..._vless_ws_early_data` (measured in run 37126222488, 4 rows that failed because they were never named). Those five were the whole of the 23 `#[ignore]`d tests in `local_xray_interop_tests` that passed unmodified against this binary at this rev (5 passed, 18 failed, run 37125321800, where all 23 were named so every row's verdict is measured); the `?ed=` pair joins them with the `EarlyData` rung, and the other sixteen are named with their failure in docs/conformance.md and are owned by P7, P15, P16, P17 and P18. Suite fetches the Xray-core checkout the tests assert on (5ca6f4b7d, pinned by the test file itself) because the harness clones only the suite's own repo"

