[sources.xray-core]
repo          = "https://github.com/XTLS/Xray-core"
rev           = "b26a91de4f3294e26a0ad0a970b81a386a41f789"
default_branch = "main"
path          = "common/crypto"
test_enabled  = false
suite         = "go test -count=1 -timeout 8m ./proxy/vless/..."
ferrox_binary = ""
note          = "Xray-core at this pin. Disabled: in-process Go suite with no seam, so no Ferrox binary can be injected; full list runs in xray-baseline.yml"

