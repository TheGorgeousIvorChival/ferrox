[sources.zeronet]
repo          = "https://github.com/TheGorgeousIvorChival/ZeroNet"
# Fork first; the official repo is the fallback when the fork is unreachable
# (see scripts/fetch-upstream.sh). The pin must resolve in whichever answers.
fallback_repo = "https://github.com/zeghostwriter/ZeroNet"
rev           = "97a99734e95029c8bf90ab0cdc578d0561a57724"
default_branch = "main"
path          = "crates"
test_enabled  = true
suite         = "cargo test -p zero-runtime --test xray_oracle -- --ignored --test-threads=1 vless_over_raw_tcp_matches_the_oracle trojan_over_raw_tcp_matches_the_oracle shadowsocks_over_raw_tcp_matches_the_oracle vless_over_websocket_matches_the_oracle vless_over_http_upgrade_matches_the_oracle vless_over_grpc_matches_the_oracle vmess_over_raw_tcp_matches_the_oracle trojan_over_websocket_matches_the_oracle"
ferrox_binary = "ferrox-app"
seam           = "ZRAY_XRAY_BINARY"
note          = "MIT-licensed Zray core + TUI + Android app; ferrox-app builds the same app surface on ferrox-core. Enabled as the raw-TCP VLESS, trojan, shadowsocks and vmess plus VLESS-over-websocket, httpupgrade and grpc plus trojan-over-websocket subset, every row measured green in the run its note names; the vmess-over-websocket oracle test needs a rung this binary closes on, and stays disabled by name in docs/conformance.md"

